name: Android companion
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify independent Java framing against Python-generated golden data
        run: |
          mkdir -p /tmp/fieldguide-java
          javac -d /tmp/fieldguide-java android/app/src/main/java/org/fieldguide/nearby/FrameCodec.java android/protocol-test/FrameCodecSelfTest.java
          java -cp /tmp/fieldguide-java FrameCodecSelfTest tests/fixtures/transport.json tests/fixtures/transport.frame.hex
      - name: Install Android build components
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build and lint the native Android companion
        run: gradle -p android --no-daemon :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: fieldguide-nearby-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint-report
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
